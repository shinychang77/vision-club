<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到這個頁面</title>
  <!-- 假廣告點進來的地方（js/ad.js），也是 GitHub Pages 找不到網頁時顯示的頁面。故意做得很普通 -->
  <style>
    :root { color-scheme: only light; }
    body { margin: 0; background: #fff; color: #333; font: 16px/1.7 "Microsoft JhengHei", "PingFang TC", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 96px 24px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0; color: #777; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>找不到這個頁面。你要找的頁面不存在，或已經移除。</p>
  </main>
</body>
</html>
